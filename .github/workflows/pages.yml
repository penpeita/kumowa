name: Publish kumowa practice to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify static site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_REPORT_API_URL: ${{ vars.REPORT_API_URL }}
        run: |
          test -n "$VITE_REPORT_API_URL" || { echo "Set REPORT_API_URL after deploying the password and mail service."; exit 1; }
          npm run build
          node scripts/check-export.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client${{ steps.pages.outputs.base_path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
